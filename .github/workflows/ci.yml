name: CI Evol Tool Atlas PWA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, Test & Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (pinned lockfile)
        run: npm ci

      - name: Generate search index and category shards
        run: npm run generate:data

      - name: TypeScript typecheck (App, Service Worker & tests)
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      # REPORT: evaluates all 2,137 entries; fails only on operational errors
      # (exit 2), never on inherited documentary gaps.
      - name: ATDS validation — REPORT mode (full catalogue)
        run: npm run validate:atds

      # STRICT gate: runs the validator CLI for positive (exit 0), negative
      # (exit 1) and operational (exit 2) controls, plus the no-regression
      # policy for the 12 priority tools. Any unexpected exit code fails CI.
      - name: ATDS validation — STRICT gate (positive, negative, regression)
        run: npm run gate:atds

      # HTML5-03: advisory structural validation of all 2,186 pages. Historical
      # findings are reported in the job summary and never fail this step; the
      # validator exits 2 on real operational errors (unknown argument, unreadable
      # catalogue, missing catalogued page, invalid allowlist), which fails CI.
      # No '|| true' and no continue-on-error.
      - name: HTML structure validation — ADVISORY (full corpus, summary)
        run: npm run validate:html -- --output="$RUNNER_TEMP/html-validation.json" --summary-md="$GITHUB_STEP_SUMMARY"

      - name: Build production PWA & copy static catalog
        env:
          VITE_BASE_PATH: /evol-tool-atlas/
        run: npm run build

      - name: Verify catalog integrity, branding & zero-mention rules
        run: npm run verify:catalog

      # QA-04: release certification — dist/ is mandatory and every offline
      # manifest URL must exist in dist/ with its SHA-256.
      - name: Verify release artifact (dist/ required)
        env:
          VITE_BASE_PATH: /evol-tool-atlas/
        run: npm run verify:release

      # QA-01/QA-02: browser tests against the same dist/ served by vite preview,
      # with Playwright's managed Chromium. Blocking: no '|| true'.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E browser tests (production build)
        env:
          VITE_BASE_PATH: /evol-tool-atlas/
        run: npm run test:e2e