name: CI Evol Tool Atlas PWA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, Test & Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (pinned lockfile)
        run: npm ci

      - name: Generate search index and category shards
        run: npm run generate:data

      - name: TypeScript typecheck (App & Service Worker)
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production PWA & copy static catalog
        env:
          VITE_BASE_PATH: /evol-tool-atlas/
        run: npm run build

      - name: Verify catalog integrity, branding & zero-mention rules
        run: npm run verify:catalog
