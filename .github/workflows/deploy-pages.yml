name: Deploy Evol Tool Atlas PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate, Test & Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (pinned lockfile)
        run: npm ci

      - name: Generate search index and category shards
        run: npm run generate:data

      - name: TypeScript typecheck (App & Service Worker)
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production PWA & copy static catalog
        env:
          VITE_BASE_PATH: /evol-tool-atlas/
        run: npm run build

      - name: Verify catalog integrity, branding & zero-mention rules
        run: npm run verify:catalog

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
